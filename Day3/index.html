<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoped CSS Variables and JS</title>
</head>

<body>
    <h2>
        Updated CSS Variables with <span class="h1">JS</span>
    </h2>
    <div class="controls">
        <label for="spacing">Spacing:</label>
        <input type="range" id="spacing" name="spacing" min="10" max="200" value="10" data-sizing="px">

        <label for="blur">Blur:</label>
        <input type="range" id="blur" name="blur" min="0" max="25" value="0" data-sizing="px">

        <label for="x">Move in X:</label>
        <input type="range" id="x" name="x" min="0" max="500" value="0" data-sizing="px">

        <label for="y">Move in Y:</label>
        <input type="range" id="y" name="y" min="0" max="500" value="0" data-sizing="px">

        <label for="base">Base Color</label>
        <input type="color" id="base" name="base" value="#ffc600">
    </div>

    <img src="./RM.jpg" alt="Photo to be used" height="350px" width="500px">
</body>

<style>
    :root {
        --base: #ffc600;
        --spacing: 10px;
        --blur: 0px;
        --x: 0px;
        --y: 0px;

    }

    img {
        padding: var(--spacing);
        background: var(--base);
        filter: blur(var(--blur));
        transform: translate(var(--x, 0px), var(--y, 0px));

    }

    .h1 {
        color: var(--base);
    }

    body {
        background-color: #193549;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 100;
        font-size: 50px;
    }

    .controls {
        margin-bottom: 50px;
    }

    a {
        color: var(--base);
        text-decoration: none;
    }

    input {
        width: 100px;
    }
</style>

<script>
    const input = document.querySelectorAll('.controls input')

    function handleUpdate() {
        const suffix = this.dataset.sizing || '';
        document.documentElement.style.setProperty(`--${this.name}`, this.value + suffix)
    }


    input.forEach(input => input.addEventListener('change', handleUpdate));
    input.forEach(input => input.addEventListener('mousemove', handleUpdate));

</script>

</html>
